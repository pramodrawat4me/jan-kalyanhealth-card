name: Keep Render backend awake

# Render's free tier spins the service down after ~15 minutes without
# traffic, which makes the next request wait ~50s for a cold start. This
# pings the public /health endpoint every 10 minutes so the instance never
# idles long enough to sleep. Runs only from the default branch (arogya).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          # --retry with retry-connrefused covers the case where the ping
          # itself is what wakes a sleeping instance (first attempt can
          # time out while Render boots it).
          curl --silent --show-error --fail \
            --max-time 60 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://janarogya-api.onrender.com/health
